<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

       tenía nada que leer). Esto queda como puente para los enlaces viejos y
       para quien tenga /frontend/ en favoritos. -->

  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://buscadoreducativo.com.ar/">
  <title>BEN — Buscador Educativo Nacional</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <script>
    location.replace("../" + location.search + location.hash);
  </script>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #0c1427; color: #e2e8f0;">
  <p>BEN se mudó acá: <a href="../" style="color: #38bdf8; font-weight: bold;">buscadoreducativo.com.ar</a></p>
</body>
</html>
